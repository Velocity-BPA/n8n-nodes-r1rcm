<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="r1rcm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="28" fill="url(#r1rcm-gradient)"/>
  
  <!-- R1 Text -->
  <text x="14" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">R1</text>
  
  <!-- RCM Text -->
  <text x="12" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">RCM</text>
  
  <!-- Healthcare Plus Symbol -->
  <g transform="translate(38, 12)">
    <rect x="-3" y="-8" width="6" height="16" fill="white" rx="1"/>
    <rect x="-8" y="-3" width="16" height="6" fill="white" rx="1"/>
  </g>
  
  <!-- Revenue Cycle Arrow -->
  <path d="M 42 38 Q 48 32 42 26" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="42,24 45,28 39,28" fill="white"/>
</svg>
